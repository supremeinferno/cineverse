<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#110e17">
    <meta name="description" content="Discover trending films and get personalized movie recommendations.">
    <title>CineVerse</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="ambient" class="ambient" aria-hidden="true"></div>

    <header class="nav">
        <a class="logo" href="/">
            <svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true">
                <rect width="24" height="24" rx="6"/>
                <path d="M9.5 7.2v9.6a.6.6 0 0 0 .92.5l7.5-4.8a.6.6 0 0 0 0-1l-7.5-4.8a.6.6 0 0 0-.92.5z"/>
            </svg>
            Cine<span>Verse</span>
        </a>

        <nav class="nav-links" aria-label="Browse">
            <a href="/#trending" data-category="trending">Trending</a>
            <a href="/#top_rated" data-category="top_rated">Top Rated</a>
            <a href="/#upcoming" data-category="upcoming">Upcoming</a>
            <a href="/#now_playing" data-category="now_playing">Now Playing</a>
        </nav>

        <form class="search" action="/" method="get" role="search">
            <input id="search-input" type="search" name="q" autocomplete="off"
                   placeholder="Search movies" aria-label="Search movies">
            <div id="suggestions" class="suggestions"></div>
        </form>
    </header>

    <main id="app"></main>

    <footer class="footer">
        <span>© 2026 CineVerse</span>
        <span>This product uses the <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a> API but is not endorsed or certified by TMDB.</span>
        <a href="https://github.com/supremeinferno/cineverse" target="_blank" rel="noopener">GitHub</a>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
