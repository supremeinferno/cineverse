<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#110e17">
    <meta name="description" content="Discover trending films and get personalized movie recommendations.">
    <title>CineVerse</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="nav">
        <a class="logo" href="/">Cine<span>Verse</span></a>

        <form class="search" action="/" method="get" role="search">
            <input id="search-input" type="search" name="q" autocomplete="off"
                   placeholder="Search movies" aria-label="Search movies">
            <div id="suggestions" class="suggestions"></div>
        </form>
    </header>

    <main id="app"></main>

    <footer class="footer">
        This product uses the TMDB API but is not endorsed or certified by TMDB.
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
